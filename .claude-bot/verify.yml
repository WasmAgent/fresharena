# Mirrors .github/workflows/ci.yml so bot local gate == GitHub CI.
commands:
  - name: install
    cmd: bun install --frozen-lockfile
    timeout: 3m
    level: 1
  - name: lint
    cmd: bun run lint
    timeout: 2m
    level: 2
  - name: typecheck
    cmd: bun run typecheck
    timeout: 3m
    level: 2
  - name: test
    cmd: bun run test
    timeout: 3m
    level: 3
  - name: verify-schemas
    cmd: node scripts/verify-schemas.mjs
    timeout: 1m
    level: 4
  - name: verify-sensitive-info
    cmd: node scripts/check-no-sensitive-info.mjs
    timeout: 1m
    level: 4
