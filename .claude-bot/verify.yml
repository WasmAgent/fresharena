# Mirrors .github/workflows/ci.yml so bot local gate == GitHub CI.
commands:
  - name: install
    cmd: bun install --frozen-lockfile
    timeout: 3m
    level: 1
  - name: lint
    cmd: bun run lint
    timeout: 2m
    level: 2
  - name: typecheck
    cmd: bun run typecheck
    timeout: 3m
    level: 2
  - name: test
    cmd: bun run test
    timeout: 3m
    level: 3
  - name: verify-schemas
    cmd: node scripts/verify-schemas.mjs
    timeout: 1m
    level: 4
  - name: verify-sensitive-info
    cmd: node scripts/check-no-sensitive-info.mjs
    timeout: 1m
    level: 4
  - name: strict-typecheck
    cmd: "set -o pipefail && bun run typecheck -- -- --strict 2>&1 | head -50"
    timeout: 3m
    level: 4
  - name: no-explicit-any
    cmd: "set -o pipefail && bun run biome lint packages/ --only=suspicious/noExplicitAny 2>&1 | tail -30"
    timeout: 2m
    level: 4
