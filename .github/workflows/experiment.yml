name: Experiment Run

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Evaluation track"
        required: true
        default: "non-llm"
        type: choice
        options:
          - non-llm
          - model-fixed
          - model-open
          - budget-normalized
      world:
        description: "Task world"
        required: true
        default: "json-transform"

permissions:
  contents: read

jobs:
  run:
    name: Run experiment (${{ inputs.track }} / ${{ inputs.world }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

      - name: Build
        run: |
          set -euo pipefail
          bun run build

      # ORG-FA-01/02: free-text workflow inputs are validated against the
      # registered worlds and passed via env + quoted expansion — they can
      # never alter the shell program or escape the worlds directory.
      # The validated value is exposed as a step output; the evaluation step
      # MUST consume that output (never the raw ${{ inputs.world }}).
      - name: Validate world id
        id: validate
        env:
          WORLD: ${{ inputs.world }}
        run: |
          set -euo pipefail
          VALIDATED=$(bun scripts/validate-world-id.mjs "$WORLD")
          echo "world=$VALIDATED" >> "$GITHUB_OUTPUT"

      - name: Run evaluation
        env:
          TRACK: ${{ inputs.track }}
          WORLD: ${{ steps.validate.outputs.world }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          bun run fresharena run \
            --track "$TRACK" \
            --world "$WORLD" \
            --output "records/run-${GITHUB_RUN_ID}.jsonl"

      - name: Generate report
        run: |
          set -euo pipefail
          bun run fresharena report "records/run-${GITHUB_RUN_ID}.jsonl"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eval-${{ github.run_id }}
          path: |
            records/run-${{ github.run_id }}.jsonl
            reports/
