name: Experiment Run

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Evaluation track"
        required: true
        default: "non-llm"
        type: choice
        options:
          - non-llm
          - model-fixed
          - model-open
          - budget-normalized
      world:
        description: "Task world"
        required: true
        default: "json-transform"

jobs:
  run:
    name: Run experiment (${{ inputs.track }} / ${{ inputs.world }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run evaluation
        run: |
          bun run fresharena run \
            --track ${{ inputs.track }} \
            --world ${{ inputs.world }} \
            --output records/run-${{ github.run_id }}.jsonl
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate report
        run: bun run fresharena report records/run-${{ github.run_id }}.jsonl

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ github.run_id }}
          path: |
            records/run-${{ github.run_id }}.jsonl
            reports/
