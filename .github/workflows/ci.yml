name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun-version: ["1.3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Check no sensitive info
        run: node scripts/check-no-sensitive-info.mjs

      - name: Verify FAEP schemas
        run: node scripts/verify-schemas.mjs

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

  quickstart:
    name: Quick Start (exact README commands, no API key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Setup Node (fresharena CLI runtime)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      # FA-QUICK-06: no API key, no secrets — fully offline.
      - name: Install the fresharena CLI globally
        run: npm install -g ./packages/cli
      # FA-QUICK-01 — README command 1, exact.
      - name: README command 1 (run)
        run: fresharena run --world worlds/json-transform --solver reference --output records/samples/sample-run.jsonl
      # FA-QUICK-02 — README command 2, exact.
      - name: README command 2 (replay)
        run: fresharena replay records/samples/sample-run.jsonl
      # FA-QUICK-03 — README command 3, exact.
      - name: README command 3 (verify)
        run: fresharena verify worlds/json-transform
      - name: Report command stays honestly unavailable
        run: |
          if fresharena report records/samples/sample-run.jsonl 2>/dev/null; then
            echo "::error::report unexpectedly succeeded — README 'planned' table is stale"
            exit 1
          fi
          echo "report correctly exits non-zero (planned)"
